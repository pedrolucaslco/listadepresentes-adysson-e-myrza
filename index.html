<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Presentes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aboreto&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="container">
            <h1>Lista de Presentes</h1>
            <p>Escolha um presente para nos ajudar nessa nova fase.</p>

            <div id="guest-bar" class="guest-bar hidden">
                <span class="guest-bar-name" id="guest-name"></span>
                <span class="guest-bar-contact" id="guest-contact"></span>
                <button id="logout-button" class="secondary">
                    Alterar pessoa
                </button>
            </div>
        </div>
    </header>

    <main class="container">

        <section class="guest-section">
            <h2>Quem está presenteando?</h2>

            <form id="guest-form">

                <div class="field">
                    <label for="nome">Seu nome</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="field">
                    <label for="contato">E-mail ou telefone</label>
                    <input
                        type="text"
                        id="contato"
                        name="contato"
                        placeholder="E-mail ou telefone"
                        required
                    >
                </div>

                <button type="submit">
                    Continuar
                </button>

            </form>

            <p id="guest-message" class="guest-message" role="alert" aria-live="assertive"></p>
        </section>

        <section id="gifts-section" class="hidden">

            <div class="section-header">
                <div>
                    <h2>Escolha um presente</h2>
                    <p>Selecione o presente que você gostaria de dar.</p>
                </div>
            </div>

            <div id="reservation-notice" class="notice hidden" role="status" aria-live="polite">
                <span id="notice-message"></span>
                <button id="notice-close" aria-label="Fechar aviso">
                    ×
                </button>
            </div>

            <div id="categories"></div>

            <div id="gifts" aria-live="polite"></div>

        </section>

    </main>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-content">

            <button id="modal-close" class="modal-close" aria-label="Fechar">
                ×
            </button>

            <h2 id="modal-title"></h2>

            <p id="modal-description"></p>

            <div class="modal-actions">
                <button id="modal-cancel" class="secondary">
                    Cancelar
                </button>

                <button id="confirm-button">
                    Confirmar presente
                </button>
            </div>

        </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="app.js"></script>

</body>
</html>
